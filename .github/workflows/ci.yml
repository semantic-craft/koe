name: CI

# Runs on GitHub-hosted macOS ARM64 runners. Routing rules: docs/agents/ci-runner.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run required checks
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          python3 scripts/ci.py
