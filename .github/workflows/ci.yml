name: CI

# Runs on the owner's own Mac (self-hosted runner), so it uses no paid
# GitHub-hosted minutes. Registration steps: docs/agents/ci-runner.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    env:
      FLUTTER_VERSION: 3.47.7
    steps:
      - uses: actions/checkout@v4
      # Use the Mac's installed Flutter. 3.47.7 ships Dart 3.13.5, which
      # satisfies pubspec's sdk ^3.12.2 (main@f42af90: analyze clean, 573 tests).
      - name: Check Flutter version
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          flutter --version
          actual=$(flutter --version --machine | python3 -c 'import json,sys;print(json.load(sys.stdin)["frameworkVersion"])')
          if [ "$actual" != "$FLUTTER_VERSION" ]; then
            echo "::error::Runner has Flutter $actual, CI expects $FLUTTER_VERSION"
            exit 1
          fi
      - run: flutter pub get
      - run: python3 -B -m unittest discover -s tools/koe-mcp -p 'test_*.py'
      - run: flutter analyze
      - run: flutter test --reporter expanded
