name: CI

# Runs on the owner's own Mac (self-hosted runner), so it uses no paid
# GitHub-hosted minutes. Registration steps: docs/agents/ci-runner.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    env:
      FLUTTER_VERSION: 3.47.7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run required checks
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          python3 scripts/ci.py
