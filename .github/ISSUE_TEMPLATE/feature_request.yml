name: 功能建议 / Feature request
description: 提议新功能或改进
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        先看 ROADMAP.md：冻结区里的方向（外部 AI 接入、Mac 双端同步、Android 等）暂不开工。
        Check ROADMAP.md first; frozen areas are not being worked on.
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem
      description: 你在什么场景下遇到了什么不便
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的样子 / Proposal
      description: 你希望 Koe 怎么做；能感知到的效果是什么
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 怎样算做完 / Acceptance
      description: 可以检查的完成条件
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案 / Alternatives
