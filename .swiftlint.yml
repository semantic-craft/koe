included:
  - platforms/apple-shared/Sources
  - platforms/macos/Sources
  - platforms/ios/App/Sources

excluded:
  - .build
  - platforms/ios/KoeiOS.xcodeproj

disabled_rules:
  - line_length
  - identifier_name
  - type_body_length
  - file_length
  - function_body_length
  - function_parameter_count
  - cyclomatic_complexity
  - nesting
  - trailing_whitespace
  - opening_brace
  - large_tuple
  - multiple_closures_with_trailing_closure
  - trailing_comma

opt_in_rules:
  - empty_count
  - fatal_error_message
  - implicitly_unwrapped_optional
  - redundant_nil_coalescing
