[package]
name = "koe-host-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Versioned C ABI and session lifecycle table for Koe native SwiftUI hosts (aligned with msime host-api)."

[lib]
name = "koe_host_api"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["local-bridge", "offline-speech"]
local-bridge = []
offline-speech = ["koe-runtime/offline-speech"]

[dependencies]
koe-runtime = { path = "../koe-runtime", default-features = false }
libc = "0.2"
serde_json = "1"

[lints]
workspace = true
