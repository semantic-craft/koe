[package]
name = "koe-client-providers"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["offline-speech"]
offline-speech = ["dep:transcribe-cpp"]

[dependencies]
koe-engine = { path = "../koe-engine" }
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
transcribe-cpp = { git = "https://github.com/anomalyco/transcribe.cpp", rev = "bcb639faa4c74a2300ba19e30360cb2355b1663a", default-features = false, optional = true }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
hound = "3.5"
