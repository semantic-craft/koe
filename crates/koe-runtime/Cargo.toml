[package]
name = "koe-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
koe-client-base = { path = "../koe-client-base" }
koe-client-providers = { path = "../koe-client-providers" }
koe-client-services = { path = "../koe-client-services" }
koe-engine = { path = "../koe-engine" }
koe-opus = { path = "../koe-opus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
ogg = "0.9"

[dev-dependencies]
libc = "0.2"
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
tokio-tungstenite = "0.30"
