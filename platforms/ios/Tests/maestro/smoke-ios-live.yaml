appId: com.semanticcraft.koe.ios
---
- extendedWaitUntil:
    visible: "模式选择"
    timeout: 15000
- tapOn:
    id: "quick-note-input"
- inputText: "SimulatorSmokeNote"
- tapOn:
    id: "quick-note-submit"
- waitForAnimationToEnd
- tapOn: "记录"
- extendedWaitUntil:
    visible: "SimulatorSmokeNote"
    timeout: 10000
- tapOn: "行动"
- extendedWaitUntil:
    visible: "待办"
    timeout: 5000
- tapOn: "问 AI"
- extendedWaitUntil:
    visible: "全部记录"
    timeout: 5000
- tapOn:
    id: "settings-button"
- extendedWaitUntil:
    visible: ".*iPhone.*"
    timeout: 10000
- takeScreenshot: settings_top
- scrollUntilVisible:
    element:
      id: "settings-speech-engine"
    direction: DOWN
- tapOn:
    id: "settings-speech-engine"
- tapOn: "云端识别"
- assertVisible: ".*云端识别.*"
- tapOn:
    id: "settings-speech-engine"
- tapOn: "Apple 本机"
- assertVisible: ".*Apple 本机.*"
- scrollUntilVisible:
    element:
      id: "settings-llm-model"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: "settings-llm-model"
- tapOn: "deepseek-v4-pro"
- tapOn:
    id: "settings-save-button"
- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element:
      id: "settings-llm-model"
    direction: DOWN
    centerElement: true
    timeout: 15000
- assertVisible: ".*deepseek-v4-pro.*"
- takeScreenshot: final_screen
