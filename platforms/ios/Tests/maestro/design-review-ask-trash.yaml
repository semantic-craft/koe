appId: com.semanticcraft.koe.ios
---
- tapOn: "行动"
- assertVisible: "待确认"
- assertNotVisible: "标记已完成"
- tapOn: {id: "review-accept-item-1"}
- tapOn: {id: "review-dismiss-item-3"}
- tapOn: "已忽略"
- tapOn: {id: "review-reset-item-3"}
- tapOn: "记忆"
- tapOn: {id: "review-accept-item-2"}
- tapOn: {id: "review-dismiss-item-4"}
- tapOn: "已忽略"
- tapOn: {id: "review-reset-item-4"}
- tapOn: "待确认"
- assertVisible: {id: "review-accept-item-4"}
- takeScreenshot: actions
- runFlow: design-ask.yaml
- tapOn: "记录"
- tapOn: "记录"
- scrollUntilVisible:
    element: "M9Archive"
    direction: DOWN
    timeout: 15000
- tapOn: "M9Archive"
- tapOn: {id: "detail-archive"}
- tapOn: "记录"
- swipe:
    from: {id: "records-filter-inbox"}
    direction: LEFT
- tapOn: {id: "records-filter-archived"}
- extendedWaitUntil:
    visible: "M9Archive"
    timeout: 25000
- assertNotVisible: "M9Disposable"
- swipe:
    from: {id: "records-row-.*"}
    direction: LEFT
- assertVisible: "取消归档"
- assertNotVisible: "移入回收站"
- assertVisible: {id: "records-row-.*"}
- swipe:
    from: {id: "records-row-.*"}
    direction: RIGHT
- swipe:
    from: {id: "records-filter-allDay"}
    direction: RIGHT
- tapOn: {id: "records-filter-all"}
- scrollUntilVisible:
    element: "M9Disposable"
    direction: DOWN
    timeout: 15000
- tapOn: "M9Disposable"
- tapOn: {id: "detail-menu"}
- tapOn: {id: "detail-trash"}
- tapOn: {id: "trash-undo"}
- extendedWaitUntil:
    visible: "M9Disposable"
    timeout: 25000
- scrollUntilVisible:
    element: "M9Disposable"
    direction: DOWN
    timeout: 15000
- tapOn: "M9Disposable"
- tapOn: {id: "detail-menu"}
- tapOn: {id: "detail-trash"}
- tapOn: {id: "records-menu"}
- tapOn: {id: "records-trash-button"}
- tapOn: {id: "trash-purge-.*"}
- tapOn: {id: "purge-cancel"}
- assertNotVisible: {id: "purge-confirm"}
- assertVisible: "M9Disposable"
- takeScreenshot: trash
- tapOn: {id: "trash-purge-.*"}
- tapOn: {id: "purge-confirm"}
- extendedWaitUntil:
    visible: "回收站为空"
    timeout: 10000
- assertNotVisible: "M9Disposable"
- takeScreenshot: purged
- tapOn: {id: "trash-sheet-close"}
