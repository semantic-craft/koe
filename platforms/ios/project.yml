name: KoeiOS
options:
  bundleIdPrefix: com.semanticcraft.koe
  createIntermediateGroups: false
  deploymentTarget:
    iOS: "17.0"
packages:
  KoeAppleShared:
    path: ../apple-shared
targets:
  KoeiOSApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Sources
    dependencies:
      - package: KoeAppleShared
        product: KoeAppleCore
    settings:
      base:
        PRODUCT_NAME: Koe
        PRODUCT_MODULE_NAME: KoeiOSApp
        PRODUCT_BUNDLE_IDENTIFIER: com.semanticcraft.koe.ios
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_VERSION: "5.10"
        MARKETING_VERSION: "2.6.0"
        CURRENT_PROJECT_VERSION: "15"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "NO"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]:
          - "$(inherited)"
          - "$(PROJECT_DIR)/../../target/ios/device"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]:
          - "$(inherited)"
          - "$(PROJECT_DIR)/../../target/ios/simulator"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lkoe_host_api"
          - "-lc++"
          - "-framework"
          - "Security"
          - "-framework"
          - "Accelerate"
  KoeiOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/KoeiOSTests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: KoeiOSApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.semanticcraft.koe.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.10"
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "NO"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Koe.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Koe"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  KoeiOSApp:
    build:
      targets:
        KoeiOSApp: all
        KoeiOSTests: [test]
    test:
      environmentVariables:
        KOE_DISABLE_CORE_BLUETOOTH: "1"
      targets:
        - KoeiOSTests
