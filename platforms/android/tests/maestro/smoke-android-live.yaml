appId: com.semanticcraft.koe
---
- extendedWaitUntil:
    visible: "模式选择"
    timeout: 15000
- tapOn:
    id: "quick-note-input"
- inputText: "AndroidSmokeNote"
- tapOn:
    id: "quick-note-submit"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "mode-switch-notes"
    direction: DOWN
    centerElement: true
    timeout: 10000
- tapOn:
    id: "mode-switch-notes"
- extendedWaitUntil:
    visible:
      id: "active-capture-bar"
    timeout: 10000
- extendedWaitUntil:
    visible: ".*正在记录.*"
    timeout: 10000
- extendedWaitUntil:
    visible: ".*00:0[1-9].*"
    timeout: 10000
- tapOn:
    id: "capture-action-pause"
- extendedWaitUntil:
    visible: ".*已暂停.*"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "capture-action-resume"
    timeout: 10000
- tapOn:
    id: "capture-action-resume"
- extendedWaitUntil:
    visible: ".*正在记录.*"
    timeout: 10000
- tapOn:
    id: "capture-action-end"
- extendedWaitUntil:
    notVisible:
      id: "active-capture-bar"
    timeout: 10000
- tapOn: "记录"
- extendedWaitUntil:
    visible: "AndroidSmokeNote"
    timeout: 10000
- extendedWaitUntil:
    visible: "Android 麦克风录音"
    timeout: 10000
- tapOn: "Android 麦克风录音"
- extendedWaitUntil:
    visible:
      id: "android-player-bar"
    timeout: 10000
- assertVisible:
    id: "player-toggle-button"
- assertVisible:
    id: "player-position-label"
- tapOn:
    id: "player-toggle-button"
- extendedWaitUntil:
    visible: "00:0[1-9] / .*"
    timeout: 10000
- assertNotVisible: "无法播放这段音频"
- extendedWaitUntil:
    visible: "开始播放"
    timeout: 30000
- assertNotVisible: "无法播放这段音频"
- tapOn: "返回"
- extendedWaitUntil:
    visible: "AndroidSmokeNote"
    timeout: 10000
- tapOn: "行动"
- extendedWaitUntil:
    visible: "待办"
    timeout: 5000
- tapOn: "问 AI"
- extendedWaitUntil:
    visible: "全部记录"
    timeout: 5000
- tapOn:
    id: "settings-button"
- extendedWaitUntil:
    visible: "Android"
    timeout: 10000
- assertVisible: "github"
- scrollUntilVisible:
    element:
      id: "settings-meeting-audio-switch"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: "settings-meeting-audio-switch"
- scrollUntilVisible:
    element:
      id: "settings-save-button"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: "settings-save-button"
- extendedWaitUntil:
    visible: "已保存模型配置"
    timeout: 10000
- takeScreenshot: final_screen
