appId: com.semanticcraft.koe
---
- extendedWaitUntil:
    visible: "模式选择"
    timeout: 15000
- tapOn:
    id: "quick-note-input"
- inputText: "AndroidSmokeNote"
- tapOn:
    id: "quick-note-submit"
- waitForAnimationToEnd
- tapOn: "记录"
- extendedWaitUntil:
    visible: "AndroidSmokeNote"
    timeout: 10000
- tapOn: "行动"
- extendedWaitUntil:
    visible: "待办"
    timeout: 5000
- tapOn: "问 AI"
- extendedWaitUntil:
    visible: "全部记录"
    timeout: 5000
- tapOn:
    id: "settings-button"
- extendedWaitUntil:
    visible: "Android"
    timeout: 10000
- assertVisible: "github"
- scrollUntilVisible:
    element:
      id: "settings-meeting-audio-switch"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "settings-meeting-audio-switch"
- scrollUntilVisible:
    element:
      id: "settings-save-button"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "settings-save-button"
- extendedWaitUntil:
    visible: "已保存模型配置"
    timeout: 10000
- takeScreenshot: final_screen
