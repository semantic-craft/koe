appId: com.semanticcraft.koe
---
- extendedWaitUntil:
    visible: "模式选择"
    timeout: 25000
- tapOn: {id: "settings-button"}
- scrollUntilVisible:
    element: {id: "settings-speech-cloud"}
    direction: DOWN
    timeout: 15000
- assertNotVisible: {id: "settings-speech-native"}
- assertNotVisible: ".*unavailable.*"
- scrollUntilVisible:
    element: {id: "settings-llm-option-deepseek-v4-pro"}
    direction: DOWN
    timeout: 15000
- back
- tapOn: {id: "tab-records"}
- scrollUntilVisible:
    element: "M9Note"
    direction: DOWN
    timeout: 15000
- tapOn: "M9Note"
- tapOn: "原文"
- extendedWaitUntil:
    visible: "M9Revised"
    timeout: 25000
- tapOn: {id: "segment-original-.*"}
- assertVisible: "M9Note"
- tapOn: {id: "tab-today"}
- scrollUntilVisible:
    element: {id: "enter-workspace-notes"}
    direction: DOWN
    timeout: 15000
- tapOn: {id: "enter-workspace-notes"}
- extendedWaitUntil:
    visible: ".*M9Project.*"
    timeout: 25000
- takeScreenshot: restart
