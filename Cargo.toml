[workspace]
resolver = "2"
members = [
  "crates/koe-cli",
  "crates/koe-client-base",
  "crates/koe-client-providers",
  "crates/koe-client-services",
  "crates/koe-engine",
  "crates/koe-host-api",
  "crates/koe-opus",
  "crates/koe-runtime",
]

[workspace.package]
version = "2.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[profile.dev]
debug = 0
incremental = false

[profile.dev.package.koe-engine]
opt-level = 3

[profile.dev.package.koe-opus]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
