[workspace]
resolver = "3"
members = ["core", "app"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
cpal = "0.16"
gpui-kit = "=0.9.0"
rodio = { version = "0.21", default-features = false, features = ["playback", "symphonia-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[profile.dev]
debug = 0
